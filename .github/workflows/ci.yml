name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parkbro
        ports:
          - 54329:5432
        # TCP check: the image's temporary init server only listens on the Unix socket.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d parkbro"
          --health-interval 2s --health-timeout 3s --health-retries 60
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:54329/postgres
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations apply to a fresh database
        run: pnpm db:migrate && pnpm db:status
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/parkbro
          # Public development-only keys from .env.example (refused outside development/test).
          FIELD_ENCRYPTION_KEYS: v1:ZGV2LW9ubHktZmllbGQta2V5LW5ldmVyLXVzZS1pdCE=
          BLIND_INDEX_KEY: ZGV2LW9ubHktYmxpbmQtaW5kZXgta2V5LW5ldmVyLXVzZSE=
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter @parkbro/e2e exec playwright install --with-deps chromium
      - name: End-to-end tests (production builds, strict CSP)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results/
          retention-days: 7
